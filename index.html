<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #111827;
    --grid: #334155;
    --accent: #22c55e;
    --accent-dark: #15803d;
    --text: #e2e8f0;
    --x-main: #38bdf8;
    --x-dark: #0369a1;
    --o-main: #f472b6;
    --o-dark: #be185d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Perspective is scoped to the game card (not body) so the tilted
     board's paint layer can never overlap UI outside its own stacking
     context and block clicks. */
  .game {
    background: var(--panel);
    border-radius: 20px;
    padding: 32px 40px 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    text-align: center;
    perspective: 900px;
  }

  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  h1 .x { color: var(--x-main); }
  h1 .o { color: var(--o-main); }

  .status {
    min-height: 1.5em;
    margin-bottom: 20px;
    font-size: 1.05rem;
    color: #94a3b8;
  }

  .status .px { color: var(--x-main); font-weight: 700; }
  .status .po { color: var(--o-main); font-weight: 700; }

  .hidden { display: none !important; }

  /* ---------- Board ---------- */

  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 96px);
    grid-template-rows: repeat(3, 96px);
    gap: 8px;
    padding: 10px;
    background: var(--grid);
    border-radius: 18px;
    margin: 0 auto 30px;
    width: max-content;
    transform: rotateX(12deg);
    transform-style: preserve-3d;
    box-shadow:
      0 10px 0 #1e293b,
      0 22px 30px rgba(0, 0, 0, 0.55);
  }

  .board.drop {
    animation: boardDrop 0.8s cubic-bezier(0.22, 0.9, 0.3, 1) both;
  }

  @keyframes boardDrop {
    0%   { opacity: 0; transform: translateY(-280px) rotateX(12deg); }
    55%  { opacity: 1; transform: translateY(16px)   rotateX(12deg); }
    75%  {             transform: translateY(-10px)  rotateX(12deg); }
    90%  {             transform: translateY(4px)    rotateX(12deg); }
    100% { opacity: 1; transform: translateY(0)      rotateX(12deg); }
  }

  /* Laser-hit vibration: the grid rattles while the winning stripe burns
     through. rotateX(12deg) is repeated in every frame so the tilt holds. */
  .board.shake {
    animation: boardShake 0.55s linear;
  }

  @keyframes boardShake {
    0%, 100% { transform: rotateX(12deg) translate(0, 0); }
    8%   { transform: rotateX(12deg) translate(-5px, 2px) rotate(-0.8deg); }
    16%  { transform: rotateX(12deg) translate(5px, -3px) rotate(0.8deg); }
    24%  { transform: rotateX(12deg) translate(-4px, -2px) rotate(-0.6deg); }
    32%  { transform: rotateX(12deg) translate(4px, 3px)  rotate(0.6deg); }
    42%  { transform: rotateX(12deg) translate(-3px, 1px) rotate(-0.4deg); }
    52%  { transform: rotateX(12deg) translate(3px, -2px) rotate(0.4deg); }
    64%  { transform: rotateX(12deg) translate(-2px, 1px) rotate(-0.25deg); }
    78%  { transform: rotateX(12deg) translate(2px, -1px) rotate(0.25deg); }
    90%  { transform: rotateX(12deg) translate(-1px, 0)   rotate(0deg); }
  }

  /* Winning-line laser overlay, drawn inside the tilted board */
  .laser {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 2;
  }

  /* Full-viewport confetti layer */
  .confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  .cell {
    border: none;
    border-radius: 14px;
    background: linear-gradient(160deg, #26334d, #1a2438);
    cursor: pointer;
    padding: 14px;
    /* Extruded 3D depth: darker offset layers below-right */
    box-shadow:
      3px 3px 0 #0d1526,
      6px 6px 0 #0a101f,
      9px 9px 16px rgba(0, 0, 0, 0.5);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }

  .cell:hover:not(:disabled):empty {
    filter: brightness(1.2);
    transform: translateY(-2px);
  }

  .cell:active:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow:
      1px 1px 0 #0d1526,
      3px 3px 0 #0a101f,
      5px 5px 10px rgba(0, 0, 0, 0.5);
  }

  .cell:disabled { cursor: default; }

  .cell.pop {
    animation: cellPop 0.4s cubic-bezier(0.3, 1.4, 0.5, 1) backwards;
  }

  @keyframes cellPop {
    0%   { opacity: 0; transform: scale(0); }
    70%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }

  .cell svg {
    width: 100%;
    height: 100%;
    display: block;
    animation: markIn 0.18s ease-out;
  }

  @keyframes markIn {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  /* ---------- Action row (Rematch, New Game + colour wheel) ---------- */

  /* position/z-index keep the buttons above the tilted board layer */
  .actions {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .actions.rise { animation: rowRise 0.4s ease-out both; }
  .actions.sink { animation: rowSink 0.3s ease-in both; }

  @keyframes rowRise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes rowSink {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(28px); }
  }

  .btn {
    position: relative;
    z-index: 1;
    border: none;
    border-radius: 12px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    color: #052e16;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-dark), 0 8px 14px rgba(0, 0, 0, 0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }

  .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }

  .btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--accent-dark), 0 4px 8px rgba(0, 0, 0, 0.4);
  }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* End-of-game row: slimmer buttons keep Rematch, New Game and the wheel
     within the board's width, so the card doesn't widen when they rise */
  .actions.end .btn { padding-left: 20px; padding-right: 20px; }

  /* Colour wheel button */
  .wheel-btn {
    position: relative;
    z-index: 1;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--grid);
    background: #1a2438;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 #0a101f, 0 8px 14px rgba(0, 0, 0, 0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .wheel-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a101f, 0 4px 8px rgba(0, 0, 0, 0.4);
  }

  .wheel-btn svg { width: 26px; height: 26px; }

  .wheel-btn:hover svg { animation: wheelSpin 0.7s ease-in-out; }

  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .wheel-btn .tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: #1f2937;
    border: 1px solid var(--grid);
    color: var(--text);
    font-size: 0.78rem;
    white-space: nowrap;
    padding: 5px 10px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .wheel-btn:hover .tooltip { opacity: 1; }

  /* ---------- Colour picker ---------- */

  .picker {
    margin-bottom: 30px;
  }

  .picker.in  { animation: pickerIn 0.35s ease-out both; }
  .picker.out { animation: pickerOut 0.3s ease-in both; }

  @keyframes pickerIn {
    from { opacity: 0; transform: translateX(70px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes pickerOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-70px); }
  }

  .picker h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #cbd5e1;
  }

  .swatches {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .swatch {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--sw-dark), 0 8px 12px rgba(0, 0, 0, 0.4);
    transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }

  .swatch:hover:not(:disabled) { transform: translateY(-3px); }

  .swatch.selected {
    border-color: #fff;
    transform: translateY(-3px) scale(1.08);
  }

  .swatch:disabled {
    filter: grayscale(1);
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ---------- Mode and difficulty steps (in the picker's card slot) ---------- */

  .choices {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .choice {
    min-width: 96px;
    padding: 10px 16px;
  }

  .choice.wide { min-width: 128px; }

  /* Caption under a button's label, e.g. "vs AI" */
  .choice small {
    display: block;
    margin-top: 2px;
    font-size: 0.72rem;
    font-weight: 600;
    opacity: 0.75;
  }

  /* The last choice is pre-highlighted when a step reopens */
  .choice.selected {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  .back-btn {
    margin-top: 18px;
    padding: 6px 12px;
    border: none;
    background: none;
    color: #94a3b8;
    font: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }

  .back-btn:hover { color: var(--text); }

  /* ---------- Narrow screens ---------- */

  /* Phones: slimmer side padding lets the card fit a 375 px screen. The
     card also clips sideways overflow, or the picker's slide-in from the
     right would widen the page (phones then scroll or zoom out); clipping
     on html doesn't stop that. Only x is clipped, so the board's drop from
     above still shows. */
  @media (max-width: 440px) {
    .game {
      padding-left: 16px;
      padding-right: 16px;
      overflow-x: clip;
    }

    /* The wheel ends the row, near the card's edge: anchor its tooltip to
       the wheel's right edge so the card's clipping can't cut it off */
    .wheel-btn .tooltip {
      left: auto;
      right: 0;
      transform: none;
    }
  }
</style>
</head>
<body>

<div class="game">
  <h1>Tic <span class="x">Tac</span> <span class="o">Toe</span></h1>
  <p class="status" id="status"></p>

  <div class="picker hidden" id="picker">
    <h2 id="pickerTitle"></h2>
    <div class="choices hidden" id="modeStep">
      <button class="btn choice wide" id="modeAiBtn">1 Player<small>vs AI</small></button>
      <button class="btn choice wide" id="mode2pBtn">2 Players<small>same device</small></button>
    </div>
    <div class="hidden" id="diffStep">
      <div class="choices">
        <button class="btn choice" id="diffEasyBtn">Easy</button>
        <button class="btn choice" id="diffMediumBtn">Medium</button>
        <button class="btn choice" id="diffHardBtn">Hard<small>Unbeatable</small></button>
      </div>
      <button class="back-btn" id="diffBackBtn">&lsaquo; Back</button>
    </div>
    <div class="swatches" id="swatches"></div>
    <button class="btn" id="confirmBtn">Confirm</button>
  </div>

  <div class="board hidden" id="board"></div>

  <div class="actions" id="actions">
    <button class="btn hidden" id="rematchBtn">Rematch</button>
    <button class="btn" id="newGameBtn">New Game</button>
    <button class="wheel-btn hidden" id="wheelBtn" aria-label="Change colours">
      <span class="tooltip">Change colours</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 12 L12 2 A10 10 0 0 1 20.66 7 Z" fill="#f87171"/>
        <path d="M12 12 L20.66 7 A10 10 0 0 1 20.66 17 Z" fill="#fbbf24"/>
        <path d="M12 12 L20.66 17 A10 10 0 0 1 12 22 Z" fill="#a3e635"/>
        <path d="M12 12 L12 22 A10 10 0 0 1 3.34 17 Z" fill="#38bdf8"/>
        <path d="M12 12 L3.34 17 A10 10 0 0 1 3.34 7 Z" fill="#a78bfa"/>
        <path d="M12 12 L3.34 7 A10 10 0 0 1 12 2 Z" fill="#f472b6"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var PALETTE = [
    { name: 'Sky blue', main: '#38bdf8', dark: '#0369a1' },
    { name: 'Pink',     main: '#f472b6', dark: '#be185d' },
    { name: 'Lime',     main: '#a3e635', dark: '#4d7c0f' },
    { name: 'Amber',    main: '#fbbf24', dark: '#b45309' },
    { name: 'Violet',   main: '#a78bfa', dark: '#6d28d9' }
  ];

  var WINS = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  // vs AI: the human always plays X, the AI always plays O
  var HUMAN = 'X';
  var AI = 'O';

  // The board's entrance is over once the drop (0.8 s) and the last cell's
  // pop (0.73 s delay + 0.4 s) have played; see buildBoard() and the CSS.
  var ENTRANCE_MS = 1150;

  // Cell pop-in (buildBoard() and .cell.pop): cell i starts popping
  // CELL_POP_START + i * CELL_POP_STEP ms after launch and takes CELL_POP_MS.
  var CELL_POP_START = 250;
  var CELL_POP_STEP = 60;
  var CELL_POP_MS = 400;

  var boardEl   = document.getElementById('board');
  var statusEl  = document.getElementById('status');
  var actionsEl = document.getElementById('actions');
  var newGameBtn = document.getElementById('newGameBtn');
  var rematchBtn = document.getElementById('rematchBtn');
  var wheelBtn   = document.getElementById('wheelBtn');
  var pickerEl   = document.getElementById('picker');
  var pickerTitle = document.getElementById('pickerTitle');
  var swatchesEl  = document.getElementById('swatches');
  var confirmBtn  = document.getElementById('confirmBtn');
  var modeStepEl  = document.getElementById('modeStep');
  var diffStepEl  = document.getElementById('diffStep');
  var modeAiBtn   = document.getElementById('modeAiBtn');
  var mode2pBtn   = document.getElementById('mode2pBtn');
  var diffBackBtn = document.getElementById('diffBackBtn');
  var diffBtns = {
    easy:   document.getElementById('diffEasyBtn'),
    medium: document.getElementById('diffMediumBtn'),
    hard:   document.getElementById('diffHardBtn')
  };

  var cells = [];
  var board = [];
  var turn = 'X';
  var gameOver = false;

  // Chosen palette indices; null until the first picker flow completes.
  var chosen = { X: null, O: null };
  var colorsChosen = false;

  // Picker flow state. The card slot also hosts the Mode and Difficulty
  // steps, so pickStage is 'mode', 'diff', or a colour stage 'X' / 'O'.
  var pickStage = 'X';
  var pickSel = { X: null, O: null };

  // Game mode, in memory only: '2p' (same device) or 'ai' (vs AI); null
  // until the Mode step is first used.
  var mode = null;
  var difficulty = null; // 'easy' | 'medium' | 'hard'

  // vs AI: who moves first in the next game. New Game resets it to the
  // human; each Rematch (or colour change) hands it to the other side.
  var firstMover = HUMAN;

  // The one pending AI move, so launchBoard() can cancel it
  var aiTimer = null;
  // The pending end-of-game step (confetti, then the action row), on one
  // handle so launchBoard() can cancel it too
  var endTimer = null;
  // Date.now() when the current board launched, to time the cell pop-ins
  var boardLaunchedAt = 0;

  // True while the action row sinks / the card slot slides out: taps are
  // ignored meanwhile, so a double tap can't run a step twice.
  var sinking = false;
  var sliding = false;

  /* ---------- SVG marks ---------- */

  function xMark() {
    return '<svg viewBox="0 0 50 50" aria-hidden="true">' +
      '<g fill="none" stroke-linecap="round">' +
      // Darker offset bars behind, for 3D depth
      '<g stroke="var(--x-dark)" stroke-width="9" transform="translate(3,3)">' +
      '<path d="M13 13 L37 37"/><path d="M37 13 L13 37"/></g>' +
      // Main bars
      '<g stroke="var(--x-main)" stroke-width="9">' +
      '<path d="M13 13 L37 37"/><path d="M37 13 L13 37"/></g>' +
      // Diagonal glint along the top-left arm of the \ bar
      '<path d="M16 16 L34 34" stroke="#fff" stroke-width="2.4" opacity="0.65" ' +
      'transform="translate(-2.2,-2.2)"/>' +
      '</g></svg>';
  }

  function oMark() {
    return '<svg viewBox="0 0 50 50" aria-hidden="true">' +
      '<g fill="none">' +
      // Darker offset ring behind, for 3D depth
      '<circle cx="28" cy="28" r="13" stroke="var(--o-dark)" stroke-width="9"/>' +
      // Main ring
      '<circle cx="25" cy="25" r="13" stroke="var(--o-main)" stroke-width="9"/>' +
      // Arc glint at the top-left of the ring
      '<path d="M13.2 19.5 A 13 13 0 0 1 19.5 13.2" stroke="#fff" ' +
      'stroke-width="2.4" opacity="0.65" transform="translate(-1.6,-1.6)"/>' +
      '</g></svg>';
  }

  /* ---------- Status line ---------- */

  function playerSpan(p) {
    return '<span class="' + (p === 'X' ? 'px' : 'po') + '">' + p + '</span>';
  }

  function setStatus(html) { statusEl.innerHTML = html; }

  /* ---------- Board ---------- */

  function buildBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (var i = 0; i < 9; i++) {
      var cell = document.createElement('button');
      cell.className = 'cell pop';
      cell.style.animationDelay = (CELL_POP_START + i * CELL_POP_STEP) + 'ms';
      cell.dataset.index = i;
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
      cells.push(cell);
    }
  }

  function launchBoard() {
    // Pending AI and end-of-game steps belong to the previous game: they
    // must never land here
    clearTimeout(aiTimer);
    clearTimeout(endTimer);
    aiTimer = null;
    endTimer = null;

    board = ['', '', '', '', '', '', '', '', ''];
    // 2 Players: X always starts. vs AI: the first move alternates.
    turn = mode === 'ai' ? firstMover : 'X';
    gameOver = false;
    buildBoard();
    boardLaunchedAt = Date.now();

    boardEl.classList.remove('hidden');
    boardEl.classList.remove('drop');
    void boardEl.offsetWidth; // restart the drop animation
    boardEl.classList.add('drop');

    // An AI that moves first waits for the board to finish landing
    startTurn(ENTRANCE_MS);
  }

  function onCellClick(e) {
    var i = +e.currentTarget.dataset.index;
    // The board also ignores taps while the AI is to move
    if (gameOver || board[i] || isAITurn()) return;
    placeMark(i);
  }

  // Human taps and AI moves both land here, so the AI's mark gets the same
  // placement animation and end-of-game effects as a human's.
  function placeMark(i) {
    board[i] = turn;
    cells[i].innerHTML = turn === 'X' ? xMark() : oMark();
    cells[i].disabled = true;

    var win = getWin(board);
    if (win) {
      gameOver = true;
      setStatus(winText(win.player));
      lockCells();
      // Laser strikes through the winning set while the grid vibrates,
      // then confetti bursts in the winner's colour, then the buttons rise.
      fireLaser(win.player, win.line);
      shakeBoard();
      // Confetti only celebrates a human win, never the AI's. Both later
      // steps chain on endTimer, so launchBoard() can cancel them.
      var celebrate = mode !== 'ai' || win.player === HUMAN;
      endTimer = setTimeout(function () {
        if (celebrate) launchConfetti(win.player);
        endTimer = setTimeout(showEndActions, 800);
      }, 300);
    } else if (board.every(function (v) { return v; })) {
      gameOver = true;
      setStatus('It&rsquo;s a draw');
      lockCells();
      endTimer = setTimeout(showEndActions, 250);
    } else {
      turn = turn === 'X' ? 'O' : 'X';
      startTurn(0);
    }
  }

  // Shows whose turn it is. On the AI's turn the board is locked and the AI
  // move is scheduled, aiDelay ms later than its usual thinking time.
  function startTurn(aiDelay) {
    if (mode !== 'ai') {
      setStatus('Player ' + playerSpan(turn) + '&rsquo;s turn');
    } else if (turn === AI) {
      setStatus('AI is thinking&hellip;');
      lockCells();
      scheduleAIMove(aiDelay);
    } else {
      setStatus('Your turn');
      unlockEmptyCells();
    }
  }

  function isAITurn() {
    return mode === 'ai' && turn === AI;
  }

  function winText(player) {
    if (mode !== 'ai') return 'Player ' + playerSpan(player) + ' wins!';
    return player === HUMAN ? 'You win!' : 'AI wins';
  }

  // Takes the board as a parameter so the AI can also run it on the
  // positions it searches
  function getWin(grid) {
    for (var w = 0; w < WINS.length; w++) {
      var a = WINS[w][0], b = WINS[w][1], c = WINS[w][2];
      if (grid[a] && grid[a] === grid[b] && grid[a] === grid[c]) {
        return { player: grid[a], line: WINS[w] };
      }
    }
    return null;
  }

  function lockCells() {
    cells.forEach(function (c) { c.disabled = true; });
  }

  function unlockEmptyCells() {
    cells.forEach(function (c, i) { c.disabled = !!board[i]; });
  }

  function showEndActions() {
    rematchBtn.classList.remove('hidden');
    wheelBtn.classList.remove('hidden');
    actionsEl.classList.add('end');
    showActions();
  }

  /* ---------- AI turn ---------- */

  function scheduleAIMove(extraDelay) {
    clearTimeout(aiTimer); // never more than one AI move pending
    // The board stays locked until the AI moves, so it can choose now
    var move = chooseAIMove(board, AI, difficulty);
    // 400-700 ms of "thinking" so the move reads like a player's, but never
    // before the chosen cell has popped in (the human may move very early)
    var delay = Math.max(extraDelay + 400 + Math.random() * 300,
                         cellSettledAt(move) - Date.now());
    aiTimer = setTimeout(function () {
      aiTimer = null;
      // launchBoard() already cancels stale timers; this is belt and braces
      if (gameOver || !isAITurn()) return;
      placeMark(move);
    }, delay);
  }

  // Date.now() time at which cell i's pop-in has finished
  function cellSettledAt(i) {
    return boardLaunchedAt + CELL_POP_START + i * CELL_POP_STEP + CELL_POP_MS;
  }

  /* ---------- AI move choice (pure: no DOM, no timers) ---------- */

  var ALL_CELLS = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  var CORNERS = [0, 2, 6, 8];
  var EDGES = [1, 3, 5, 7];

  function otherMark(mark) {
    return mark === 'X' ? 'O' : 'X';
  }

  function emptyCells(grid, among) {
    return among.filter(function (i) { return !grid[i]; });
  }

  function isFull(grid) {
    for (var i = 0; i < 9; i++) {
      if (!grid[i]) return false;
    }
    return true;
  }

  // Uniform pick; min() guards against an rng that returns exactly 1
  function randomOf(list, rng) {
    return list[Math.min(list.length - 1, Math.floor(rng() * list.length))];
  }

  // An empty cell that completes a line of three for mark, or -1
  function winningMove(grid, mark) {
    for (var w = 0; w < WINS.length; w++) {
      var line = WINS[w], own = 0, empty = -1;
      for (var k = 0; k < 3; k++) {
        if (grid[line[k]] === mark) own++;
        else if (!grid[line[k]]) empty = line[k];
      }
      if (own === 2 && empty !== -1) return empty;
    }
    return -1;
  }

  // Minimax score for aiMark with toMove to play, depth moves after the
  // real position. An AI win scores 10 - depth and a loss depth - 10, so the
  // AI wins as fast as it can and loses as late as it can. Alpha-beta skips
  // replies that can no longer change the score. Mutates grid, then undoes.
  function minimax(grid, toMove, aiMark, depth, alpha, beta) {
    var win = getWin(grid);
    if (win) return win.player === aiMark ? 10 - depth : depth - 10;
    if (isFull(grid)) return 0;

    var maximizing = toMove === aiMark;
    var best = maximizing ? -Infinity : Infinity;
    for (var i = 0; i < 9 && alpha < beta; i++) {
      if (grid[i]) continue;
      grid[i] = toMove;
      var score = minimax(grid, otherMark(toMove), aiMark, depth + 1, alpha, beta);
      grid[i] = '';
      if (maximizing) {
        best = Math.max(best, score);
        alpha = Math.max(alpha, best);
      } else {
        best = Math.min(best, score);
        beta = Math.min(beta, best);
      }
    }
    return best;
  }

  // Hard: scores every move exactly, then picks randomly among the best, so
  // it varies its play but never loses.
  function hardMove(grid, aiMark, rng) {
    var best = -Infinity, bestMoves = [];
    for (var i = 0; i < 9; i++) {
      if (grid[i]) continue;
      grid[i] = aiMark;
      // A full window per move keeps each score exact, so ties are real
      var score = minimax(grid, otherMark(aiMark), aiMark, 1, -Infinity, Infinity);
      grid[i] = '';
      if (score > best) {
        best = score;
        bestMoves = [i];
      } else if (score === best) {
        bestMoves.push(i);
      }
    }
    return randomOf(bestMoves, rng);
  }

  // The AI's move: index 0-8 of an empty cell. Never mutates the board it
  // is given and draws all randomness from rng (default Math.random), so the
  // Dev Manager's QA can test it in isolation through window.TTT.
  function chooseAIMove(grid, aiMark, level, rng) {
    grid = grid.slice(); // search a copy, never the caller's board
    rng = rng || Math.random;
    if (level === 'hard') return hardMove(grid, aiMark, rng);

    // Easy and Medium both take a win when there is one
    var move = winningMove(grid, aiMark);
    if (move !== -1) return move;
    if (level === 'easy') return randomOf(emptyCells(grid, ALL_CELLS), rng);

    // Medium: block, else centre, else a corner, else an edge. There is no
    // look-ahead, so a fork beats it; that's intended.
    move = winningMove(grid, otherMark(aiMark));
    if (move !== -1) return move;
    if (!grid[4]) return 4;
    var corners = emptyCells(grid, CORNERS);
    if (corners.length) return randomOf(corners, rng);
    return randomOf(emptyCells(grid, EDGES), rng);
  }

  window.TTT = { chooseAIMove: chooseAIMove };

  /* ---------- Win effects: laser, shake, confetti ---------- */

  function shakeBoard() {
    boardEl.classList.remove('drop', 'shake');
    void boardEl.offsetWidth;
    boardEl.classList.add('shake');
  }

  function fireLaser(winner, line) {
    var color = PALETTE[chosen[winner]].main;
    var NS = 'http://www.w3.org/2000/svg';

    // Cell centres in the board's (pre-transform) layout space
    var pts = line.map(function (i) {
      var c = cells[i];
      return {
        x: c.offsetLeft + c.offsetWidth / 2,
        y: c.offsetTop + c.offsetHeight / 2
      };
    });
    var p0 = pts[0], p2 = pts[2];
    var dx = p2.x - p0.x, dy = p2.y - p0.y;
    var span = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / span, uy = dy / span;
    var ext = 30; // overshoot past the outer cells for a full slash
    var x1 = p0.x - ux * ext, y1 = p0.y - uy * ext;
    var x2 = p2.x + ux * ext, y2 = p2.y + uy * ext;
    var len = span + ext * 2;

    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'laser');
    svg.setAttribute('viewBox', '0 0 ' + boardEl.clientWidth + ' ' + boardEl.clientHeight);

    function beamLine(width, stroke, opacity, blur) {
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', stroke);
      l.setAttribute('stroke-width', width);
      l.setAttribute('stroke-linecap', 'round');
      l.setAttribute('opacity', opacity);
      if (blur) l.style.filter = 'blur(' + blur + 'px)';
      l.style.strokeDasharray = len;
      l.style.strokeDashoffset = len;
      svg.appendChild(l);
      return l;
    }

    var glow = beamLine(14, color, 0.6, 4);  // coloured halo
    var core = beamLine(5, '#fff', 0.95, 0); // white-hot core

    // Spark travelling at the beam tip
    var spark = document.createElementNS(NS, 'circle');
    spark.setAttribute('r', 5);
    spark.setAttribute('fill', '#fff');
    spark.style.filter = 'drop-shadow(0 0 8px ' + color + ')';
    spark.style.transform = 'translate(' + x1 + 'px,' + y1 + 'px)';
    svg.appendChild(spark);

    boardEl.appendChild(svg);

    var D = 350; // beam draw time
    [glow, core].forEach(function (l) {
      l.animate(
        [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: D, easing: 'ease-in', fill: 'forwards' }
      );
    });
    spark.animate(
      [
        { transform: 'translate(' + x1 + 'px,' + y1 + 'px)' },
        { transform: 'translate(' + x2 + 'px,' + y2 + 'px)' }
      ],
      { duration: D, easing: 'ease-in', fill: 'forwards' }
    );
    spark.animate(
      [{ opacity: 1 }, { opacity: 0 }],
      { duration: 250, delay: D, fill: 'forwards' }
    );

    // Unstable afterglow flicker once the cut lands
    glow.animate(
      [{ opacity: 0.6 }, { opacity: 1 }, { opacity: 0.45 },
       { opacity: 0.95 }, { opacity: 0.65 }],
      { duration: 450, delay: D, fill: 'forwards' }
    );
    core.animate(
      [{ opacity: 0.95 }, { opacity: 0.55 }, { opacity: 1 }, { opacity: 0.85 }],
      { duration: 450, delay: D, fill: 'forwards' }
    );
  }

  function mixWithWhite(hex, t) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r + (255 - r) * t);
    g = Math.round(g + (255 - g) * t);
    b = Math.round(b + (255 - b) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function launchConfetti(winner) {
    var pal = PALETTE[chosen[winner]];
    var shades = [pal.main, pal.dark, mixWithWhite(pal.main, 0.45)];

    var canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');

    var parts = [];
    function burst(fromLeft) {
      var x0 = fromLeft ? -10 : canvas.width + 10;
      for (var i = 0; i < 42; i++) {
        parts.push({
          x: x0,
          y: canvas.height * 0.62 + (Math.random() - 0.5) * 80,
          vx: (4 + Math.random() * 9) * (fromLeft ? 1 : -1),
          vy: -(4 + Math.random() * 8),
          w: 5 + Math.random() * 5,
          h: 8 + Math.random() * 6,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3,
          color: shades[(Math.random() * shades.length) | 0],
          life: 0,
          ttl: 90 + Math.random() * 60
        });
      }
    }
    burst(true);  // from the left
    burst(false); // from the right

    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      var alive = false;
      parts.forEach(function (p) {
        if (p.life >= p.ttl) return;
        alive = true;
        p.life++;
        p.vy += 0.22;  // gravity
        p.vx *= 0.985; // air drag
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        ctx.save();
        ctx.globalAlpha = Math.min(1, (p.ttl - p.life) / 30);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (alive) requestAnimationFrame(tick);
      else canvas.remove();
    }
    requestAnimationFrame(tick);
  }

  /* ---------- Action row ---------- */

  function showActions() {
    actionsEl.classList.remove('hidden', 'sink');
    void actionsEl.offsetWidth;
    actionsEl.classList.add('rise');
  }

  function sinkActions(done) {
    // Ignore clicks while sinking: a double click would run done() twice
    if (sinking) return;
    sinking = true;
    actionsEl.classList.remove('rise');
    void actionsEl.offsetWidth;
    actionsEl.classList.add('sink');
    setTimeout(function () {
      actionsEl.classList.add('hidden');
      actionsEl.classList.remove('sink');
      sinking = false;
      done();
    }, 300);
  }

  newGameBtn.addEventListener('click', function () {
    sinkActions(function () {
      firstMover = HUMAN; // after New Game the human moves first
      openModeStep();
    });
  });

  rematchBtn.addEventListener('click', function () {
    sinkActions(function () {
      // Same mode, difficulty and colours; vs AI swaps who moves first
      if (mode === 'ai') firstMover = otherMark(firstMover);
      launchBoard();
    });
  });

  wheelBtn.addEventListener('click', function () {
    sinkActions(function () {
      // A colour change is a rematch in new colours, so vs AI swaps too
      if (mode === 'ai') firstMover = otherMark(firstMover);
      openPicker();
    });
  });

  /* ---------- Mode and difficulty steps ---------- */

  // These steps share the colour picker's card slot (#picker), so they get
  // its look and slide animations.

  function openModeStep() {
    openCard('mode');
  }

  function renderChoices() {
    pickerTitle.innerHTML = pickStage === 'mode' ? 'Choose a mode' : 'Choose difficulty';
    // Pre-highlight the last choice
    modeAiBtn.classList.toggle('selected', mode === 'ai');
    mode2pBtn.classList.toggle('selected', mode === '2p');
    Object.keys(diffBtns).forEach(function (level) {
      diffBtns[level].classList.toggle('selected', level === difficulty);
    });
  }

  // Last step of the new-game flow: pick colours if none were chosen this
  // session, otherwise go straight to the board.
  function finishModeSteps() {
    if (colorsChosen) {
      closePicker(launchBoard);
    } else {
      slidePickerStage(function () {
        // Pre-select previous colours, as openPicker() does
        pickSel.X = chosen.X;
        pickSel.O = chosen.O;
        showStage('X');
      });
    }
  }

  modeAiBtn.addEventListener('click', function () {
    if (sliding) return;
    mode = 'ai';
    slidePickerStage(function () { showStage('diff'); });
  });

  mode2pBtn.addEventListener('click', function () {
    if (sliding) return;
    mode = '2p';
    finishModeSteps();
  });

  Object.keys(diffBtns).forEach(function (level) {
    diffBtns[level].addEventListener('click', function () {
      if (sliding) return;
      difficulty = level;
      finishModeSteps();
    });
  });

  diffBackBtn.addEventListener('click', function () {
    if (sliding) return;
    slidePickerStage(function () { showStage('mode'); });
  });

  /* ---------- Colour picker ---------- */

  // Shows the card slot at the given stage, sliding it in where the board was
  function openCard(stage) {
    boardEl.classList.add('hidden');
    setStatus('');
    showStage(stage);

    pickerEl.classList.remove('hidden', 'out');
    void pickerEl.offsetWidth;
    pickerEl.classList.add('in');
  }

  function openPicker() {
    // Pre-select previous colours so they can be kept or changed
    pickSel.X = chosen.X;
    pickSel.O = chosen.O;
    openCard('X');
  }

  // Swaps the card slot's content to a step: 'mode', 'diff', 'X' or 'O'
  function showStage(stage) {
    var colourStage = stage === 'X' || stage === 'O';
    pickStage = stage;
    modeStepEl.classList.toggle('hidden', stage !== 'mode');
    diffStepEl.classList.toggle('hidden', stage !== 'diff');
    swatchesEl.classList.toggle('hidden', !colourStage);
    confirmBtn.classList.toggle('hidden', !colourStage);
    if (colourStage) {
      renderPicker();
    } else {
      renderChoices();
    }
  }

  function renderPicker() {
    // vs AI has one colour step: only the human picks
    pickerTitle.innerHTML = mode === 'ai'
      ? 'You: pick a colour'
      : 'Player ' + playerSpan(pickStage) + ' &mdash; pick a colour';

    swatchesEl.innerHTML = '';
    PALETTE.forEach(function (col, i) {
      var sw = document.createElement('button');
      sw.className = 'swatch';
      sw.title = col.name;
      sw.setAttribute('aria-label', col.name);
      sw.style.background = col.main;
      sw.style.setProperty('--sw-dark', col.dark);

      // The other player's colour is greyed out and disabled
      if (pickStage === 'O' && i === pickSel.X) {
        sw.disabled = true;
      }
      if (pickSel[pickStage] === i && !sw.disabled) {
        sw.classList.add('selected');
      }

      sw.addEventListener('click', function () {
        // Ignore taps while the card slides: the pick is already confirmed
        if (sliding) return;
        pickSel[pickStage] = i;
        renderPicker();
      });
      swatchesEl.appendChild(sw);
    });

    confirmBtn.disabled = pickSel[pickStage] === null;
  }

  function slidePickerStage(next) {
    sliding = true;
    pickerEl.classList.remove('in');
    void pickerEl.offsetWidth;
    pickerEl.classList.add('out');
    // setTimeout (not animationend) so the callback can never silently fail
    setTimeout(function () {
      pickerEl.classList.remove('out');
      next();
      pickerEl.classList.remove('hidden');
      void pickerEl.offsetWidth;
      pickerEl.classList.add('in');
      sliding = false;
    }, 300);
  }

  confirmBtn.addEventListener('click', function () {
    if (sliding || pickSel[pickStage] === null) return;

    if (pickStage === 'X' && mode !== 'ai') {
      // If O's pre-selection now collides with X's pick, clear it
      if (pickSel.O === pickSel.X) pickSel.O = null;
      slidePickerStage(function () {
        pickStage = 'O';
        renderPicker();
      });
    } else {
      chosen.X = pickSel.X;
      // vs AI: the AI's colour follows the human's pick automatically
      chosen.O = mode === 'ai' ? aiColor(chosen.X) : pickSel.O;
      colorsChosen = true;
      applyColors();
      closePicker(launchBoard);
    }
  });

  // The AI keeps its current colour unless the human just took it; then it
  // takes the first free palette colour. Before anyone has picked, O shows
  // the stylesheet's default colour, Pink (PALETTE[1]).
  function aiColor(human) {
    var current = chosen.O === null ? 1 : chosen.O;
    if (current !== human) return current;
    for (var i = 0; i < PALETTE.length; i++) {
      if (i !== human) return i;
    }
  }

  function closePicker(done) {
    sliding = true;
    pickerEl.classList.remove('in');
    void pickerEl.offsetWidth;
    pickerEl.classList.add('out');
    // setTimeout (not animationend) so the callback can never silently fail
    setTimeout(function () {
      pickerEl.classList.add('hidden');
      pickerEl.classList.remove('out');
      sliding = false;
      done();
    }, 300);
  }

  function applyColors() {
    var root = document.documentElement.style;
    root.setProperty('--x-main', PALETTE[chosen.X].main);
    root.setProperty('--x-dark', PALETTE[chosen.X].dark);
    root.setProperty('--o-main', PALETTE[chosen.O].main);
    root.setProperty('--o-dark', PALETTE[chosen.O].dark);
  }

  /* ---------- First load: only the New Game button is shown ---------- */

  boardEl.classList.add('hidden');
  pickerEl.classList.add('hidden');
  rematchBtn.classList.add('hidden');
  wheelBtn.classList.add('hidden');
  setStatus('');
})();
</script>

</body>
</html>
